name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q handshake scripts
      - run: python -m pytest -q tests
      - name: Compose file is valid with the secrets up.py writes
        run: python -c "from scripts.up import env_file; env_file()" && docker compose -f deploy/standalone-docker-compose.yml --env-file deploy/.env --profile collab --profile gateway config -q
